<section class="book-form">
  <div class="overlay">

    <!-- 
     id: number;
  title: string;
  content?: string;
  authorName: string;
  ageRange: AgeRange;
  language?: string;
  status: 'DRAFT' | 'PUBLISHED';
  cover: File | null;
  value: string;
}
    -->

    <h1>Novo Livro Infanto-Juvenil</h1>
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">

      <table class="form-table">
        <tr>
          <td>
            <mat-form-field appearance="fill" class="full-width">
              <mat-label>Título</mat-label>
              <input matInput formControlName="title" (change)="transformToUpperCased()" />
              <ng-container *ngIf="titleUppercased !== ''">
                <span style="color: red;">
                  {{ titleUppercased | uppercaseTitle }}
                </span>
              </ng-container>
            </mat-form-field>
          </td>

          <td>
            <mat-form-field appearance="fill" class="full-width">
              <mat-label>Nome do Autor</mat-label>
              <input matInput formControlName="authorName" />
            </mat-form-field>
          </td>
        </tr>

        <tr>
          <td>
            <mat-form-field appearance="fill" class="full-width">
              <mat-label (mouseenter)="showFormat = true" (mouseleave)="showFormat = false">
                Valor
              </mat-label>
                {{ bookForm.get('value')?.value }}
              <mat-hint *ngIf="showFormat && numero !== null">
                Formatado: {{ numero | currency:'BRL':'symbol':'1.2-2' }}
              </mat-hint>

              <input matInput formControlName="value" (blur)="comporHint()" />
            </mat-form-field>
          </td>

          <!-- <td>
            <mat-form-field appearance="fill" class="full-width">
              <mat-label>Faixa etária</mat-label>
              <mat-select formControlName="ageRange">
                <mat-option *ngFor="let age of ageRanges" [value]="age.value">
                  {{ age.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </td> -->
        </tr>

        <tr>
          <td colspan="2">
            <button mat-raised-button color="primary" type="submit" [disabled]="bookForm.invalid">
              Salvar
            </button>
          </td>
        </tr>
      </table>

    </form>
  </div>
</section>
